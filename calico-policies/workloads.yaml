# Three-tier demo application for the east-west experiments:
# frontend -> api -> database, each in its own namespace.
---
apiVersion: v1
kind: Namespace
metadata:
  name: tier-frontend
  labels: {tier: frontend}
---
apiVersion: v1
kind: Namespace
metadata:
  name: tier-api
  labels: {tier: api}
---
apiVersion: v1
kind: Namespace
metadata:
  name: tier-db
  labels: {tier: db}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: tier-frontend
spec:
  replicas: 2
  selector: {matchLabels: {app: frontend}}
  template:
    metadata: {labels: {app: frontend}}
    spec:
      containers:
        - name: web
          image: nginx:1.27
          ports: [{containerPort: 80}]
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: tier-frontend
spec:
  type: LoadBalancer          # MetalLB VIP
  selector: {app: frontend}
  ports: [{port: 80, targetPort: 80}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: tier-api
spec:
  replicas: 2
  selector: {matchLabels: {app: api}}
  template:
    metadata: {labels: {app: api}}
    spec:
      containers:
        - name: api
          image: nginx:1.27       # stand-in HTTP responder
          ports: [{containerPort: 80}]
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: tier-api
spec:
  selector: {app: api}
  ports: [{port: 80, targetPort: 80}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: tier-db
spec:
  replicas: 1
  selector: {matchLabels: {app: db}}
  template:
    metadata: {labels: {app: db}}
    spec:
      containers:
        - name: postgres
          image: postgres:16
          env:
            - name: POSTGRES_PASSWORD
              value: probe-only-not-secret
          ports: [{containerPort: 5432}]
---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: tier-db
spec:
  selector: {app: db}
  ports: [{port: 5432, targetPort: 5432}]
