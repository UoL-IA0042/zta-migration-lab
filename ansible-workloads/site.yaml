# Representative enterprise workloads on tpi2-3: PostgreSQL (per-role
# grants), intranet web, SMB file service, and a deliberately legacy
# unauthenticated TCP service.
---
- name: Deploy protected workloads
  hosts: workloads
  become: true
  tasks:
    - name: Install Docker Engine and compose plugin
      ansible.builtin.apt:
        name: [docker.io, docker-compose-v2]
        state: present
        update_cache: true

    - name: Enable and start Docker
      ansible.builtin.systemd:
        name: docker
        enabled: true
        state: started

    - name: Create directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ workloads_install_dir }}"
        - "{{ workloads_install_dir }}/www"
        - "{{ workloads_install_dir }}/share"

    - name: Intranet web content
      ansible.builtin.copy:
        dest: "{{ workloads_install_dir }}/www/index.html"
        mode: "0644"
        content: |
          <!doctype html><title>Lab Intranet</title>
          <h1>Lab intranet application</h1><p>tpi2-3 workload.</p>

    - name: Seed file share
      ansible.builtin.copy:
        dest: "{{ workloads_install_dir }}/share/README.txt"
        mode: "0644"
        content: "Lab file share seed object.\n"

    # The image runs init scripts as its postgres user (uid 999 in the
    # Debian-based postgres image), so it must be able to read the file;
    # 0640 keeps the role passwords in it unreadable to other host users.
    # If the script cannot run, the container exits, restarts, and skips
    # init on the now non-empty pgdata: the check at the end catches that.
    - name: Template database init (per-role users and grants)
      ansible.builtin.template:
        src: templates/init.sql.j2
        dest: "{{ workloads_install_dir }}/init.sql"
        owner: "{{ postgres_container_uid }}"
        group: "{{ postgres_container_uid }}"
        mode: "0640"

    - name: Template compose file
      ansible.builtin.template:
        src: templates/docker-compose.yaml.j2
        dest: "{{ workloads_install_dir }}/docker-compose.yaml"
        mode: "0640"

    - name: Start workloads
      ansible.builtin.command:
        cmd: docker compose up -d
        chdir: "{{ workloads_install_dir }}"
      register: up
      changed_when: "'Started' in up.stderr or 'Created' in up.stderr"

    # iperf3 server: the perf-battery throughput target (not an access-matrix
    # resource). Own unit name so it never clashes with a packaged
    # iperf3.service; DynamicUser so it runs unprivileged.
    - name: Install iperf3
      ansible.builtin.apt:
        name: iperf3
        state: present
      environment:
        DEBIAN_FRONTEND: noninteractive   # skip the package's "start daemon?" prompt

    - name: iperf3 server unit
      ansible.builtin.copy:
        dest: /etc/systemd/system/lab-iperf3.service
        mode: "0644"
        content: |
          [Unit]
          Description=iperf3 server (perf-battery throughput target)
          After=network-online.target
          Wants=network-online.target

          [Service]
          ExecStart=/usr/bin/iperf3 --server --port {{ iperf3_port }}
          DynamicUser=yes
          Restart=always

          [Install]
          WantedBy=multi-user.target

    - name: Enable and start the iperf3 server
      ansible.builtin.systemd:
        name: lab-iperf3.service
        daemon_reload: true
        enabled: true
        state: started

    - name: Verify intranet web responds
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}:8080/"
        status_code: 200
      retries: 6
      delay: 5
      register: web
      until: web.status == 200

    - name: Verify postgres accepts connections
      ansible.builtin.command:
        cmd: docker exec workloads-postgres-1 pg_isready -U postgres
      register: pg
      retries: 6
      delay: 5
      until: pg.rc == 0
      changed_when: false

    - name: Verify the iperf3 server accepts connections (from the controller)
      ansible.builtin.wait_for:
        host: "{{ ansible_host }}"
        port: "{{ iperf3_port }}"
        timeout: 30
      delegate_to: localhost
      become: false

    # pg_isready alone passes even when init.sql never ran (see above).
    - name: Verify init.sql ran (roles exist, CONNECT matches the access model)
      ansible.builtin.command:
        cmd: >-
          docker exec workloads-postgres-1 psql -U postgres -d {{ db_name }} -tAc
          "SELECT rolname || '|' || has_database_privilege(rolname, '{{ db_name }}', 'CONNECT')
           FROM pg_roles WHERE rolname LIKE 'remote-%' ORDER BY rolname"
      register: pg_roles
      retries: 6
      delay: 5
      until: pg_roles.stdout_lines == db_expected_connect
      changed_when: false
