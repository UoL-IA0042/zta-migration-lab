# Inventory for the Turing Pi 2 cluster (Phase 1 baseline).
# Adjust addresses to match your management network.
---
all:
  children:
    turingpi:
      hosts:
        tpi2-1:
          ansible_host: 10.0.0.71   # management / observability
        tpi2-2:
          ansible_host: 10.0.0.72   # identity / control plane
        tpi2-3:
          ansible_host: 10.0.0.73   # protected workloads
        tpi2-4:
          ansible_host: 10.0.0.251  # access gateway (OpenVPN)
    vpn:
      hosts:
        tpi2-4:
    aws_vpn_gateway:
      hosts:
        aws-vpn-gateway:
          # Elastic IP from terraform-aws, supplied via the environment so
          # no public address is committed:
          #   export AWS_VPN_GATEWAY_IP=$(terraform output -raw vpn_gateway_public_ip)
          ansible_host: "{{ lookup('env', 'AWS_VPN_GATEWAY_IP') }}"
  vars:
    ansible_user: ubuntu
    ansible_python_interpreter: /usr/bin/python3
