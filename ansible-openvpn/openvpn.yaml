# Phase 1: perimeter baseline — OpenVPN remote access + AWS site-to-site.
#
# Three plays, all built on the community role kyl191.openvpn (pinned in
# requirements.yaml):
#   1. Site-to-site hub on the AWS VPN gateway (terraform-aws). tpi2-4 is
#      its only client and owns the on-prem LAN route (iroute).
#   2. Remote-access server on tpi2-4 for the emulated remote workers,
#      with the perimeter ruleset.
#   3. Site-to-site client on tpi2-4. It dials OUT to the hub, so the AWS
#      leg needs no inbound port on the ISP gateway.
# Client profiles (remote workers, and tpi2-4's site-to-site profile) are
# fetched to ~/ovpn-client-configs/ on the control machine.
#
# Run:
#   ansible-galaxy install -r requirements.yaml
#   export AWS_VPN_GATEWAY_IP=$(terraform -chdir=../terraform-aws output -raw vpn_gateway_public_ip)
#   LAB_VPN_ENDPOINT=<lab public IP or DDNS name> \
#     ansible-playbook -i inventory.yaml openvpn.yaml
#
# Split-tunnel configuration: clients are routed only to the lab and AWS
# subnets, mirroring a typical enterprise remote-access VPN. Access control
# in this phase is deliberately coarse: group-based network ACLs on the VPN
# concentrator (perimeter_ruleset below). That ruleset is the documented
# "legacy" input artifact for the Phase 3 rule-to-policy translation.
---
- name: Deploy the site-to-site hub on the AWS VPN gateway
  hosts: aws_vpn_gateway
  become: true
  gather_facts: false               # facts gathered after the address check

  vars:
    lab_onprem_network: 10.0.0.0
    lab_onprem_netmask: 255.255.255.0
    aws_vpc_network: 10.100.0.0
    aws_vpc_netmask: 255.255.0.0

  pre_tasks:
    - name: Require the hub's Elastic IP
      ansible.builtin.assert:
        that: ansible_host | default('') | length > 0
        fail_msg: >-
          Set AWS_VPN_GATEWAY_IP (terraform output -raw vpn_gateway_public_ip
          in terraform-aws/).
        quiet: true

    - name: Gather facts
      ansible.builtin.setup:

  roles:
    - role: kyl191.openvpn
      # --- Transport ------------------------------------------------
      openvpn_port: 1194
      openvpn_proto: udp
      openvpn_dualstack: false
      openvpn_server_network: 10.9.1.0   # site-to-site transit
      openvpn_server_netmask: 255.255.255.0
      openvpn_server_ipv6_network: ""
      openvpn_server_hostname: "{{ ansible_host }}"

      # --- Routing: the lab LAN lives behind the tpi2-4 client ---------
      # `route` puts the LAN in the hub's kernel table (the VPC route table
      # already sends 10.0.0.0/24 to this instance); `iroute` tells
      # OpenVPN which client owns it. The VPC route is pushed to tpi2-4.
      openvpn_redirect_gateway: ""
      openvpn_set_dns: false
      openvpn_push:
        - "route {{ aws_vpc_network }} {{ aws_vpc_netmask }}"
      openvpn_client_config: true
      openvpn_client_configs:
        tpi2-4:
          - "iroute {{ lab_onprem_network }} {{ lab_onprem_netmask }}"
      openvpn_addl_server_options:
        - "route {{ lab_onprem_network }} {{ lab_onprem_netmask }}"
        - ccd-exclusive
      # Fixed interface name on tpi2-4, so the remote-access server keeps
      # tun0 (the role's ufw rules and the perimeter ruleset assume it).
      openvpn_addl_client_options:
        - dev s2s0
        - dev-type tun

      # --- Behavior --------------------------------------------------
      openvpn_client_to_client: false
      openvpn_topology: subnet
      openvpn_client_register_dns: false

      # --- Security --------------------------------------------------
      openvpn_cipher: "AES-256-GCM"
      openvpn_auth_alg: SHA256
      openvpn_use_tls_crypt: true
      openvpn_use_crl: true
      openvpn_sync_certs: true
      openvpn_verify_cn: false
      openvpn_duplicate_cn: false
      openvpn_client_cn_prefix: ""       # CN = ccd name = tpi2-4

      # --- Single client: the on-prem gateway --------------------------
      openvpn_clients:
        - tpi2-4

      # --- Fetch tpi2-4's profile for play 3 ---------------------------
      openvpn_fetch_client_configs: true
      openvpn_fetch_client_configs_dir: "{{ lookup('env', 'HOME') }}/ovpn-client-configs"
      openvpn_fetch_client_configs_per_user_dir: true

      # --- Firewall / NAT --------------------------------------------
      # Exposure is controlled by the security group (lab_egress_cidr
      # only); the perimeter ruleset is enforced on tpi2-4.
      openvpn_firewall: ufw
      openvpn_manage_firewall_rules: true
      openvpn_manage_sysctl: true

- name: Deploy perimeter-baseline OpenVPN server
  hosts: vpn
  become: true
  gather_facts: true

  vars:
    # --- Lab addressing (docs/addressing.md) -------------------------
    lab_onprem_network: 10.0.0.0
    lab_onprem_netmask: 255.255.255.0
    lab_onprem_cidr: 10.0.0.0/24
    aws_vpc_network: 10.100.0.0
    aws_vpc_netmask: 255.255.0.0
    aws_vpc_cidr: 10.100.0.0/16
    lab_dns_server: 10.0.0.153       # lab DNS/DHCP (dnsmasq on lab-dns)

    # Public name/IP remote workers dial; the ISP gateway forwards
    # 1194/udp to tpi2-4. Taken from the environment so no public
    # address is committed (journal rule: no non-lab IPs).
    lab_vpn_endpoint: "{{ lookup('env', 'LAB_VPN_ENDPOINT') }}"

    # --- VPN groups ----------------------------------------------------
    # Every client has a fixed tunnel address (ccd ifconfig-push, see
    # openvpn_client_configs) inside its group's range, and the ruleset
    # matches on those ranges. Keep both in sync with docs/addressing.md.
    vpn_group_ranges:
      staff: 10.9.0.16/28            # remote-admin, -developer, -analyst
      contractor: 10.9.0.32/28       # remote-contractor

    # --- Perimeter ruleset (legacy artifact, Phase 3 input) -----------
    # Routed traffic from the tunnel is denied unless listed here. Group
    # membership grants broad network reachability, as in a typical
    # perimeter VPN: staff reach everything on-prem and in AWS;
    # contractors reach the intranet and DNS, plus postgres, where the
    # database refuses them (documented over-breadth, see
    # ansible-workloads). Rules are additive: removing an entry here does
    # not delete the live rule; experiments start from a re-flashed node.
    perimeter_ruleset:
      - {group: staff, to: "{{ lab_onprem_cidr }}", comment: "staff -> on-prem LAN"}
      - {group: staff, to: "{{ aws_vpc_cidr }}", comment: "staff -> AWS VPC"}
      - {group: contractor, to: 10.0.0.73, port: 8080, proto: tcp, comment: "contractor -> intranet-web"}
      - {group: contractor, to: 10.0.0.73, port: 5432, proto: tcp, comment: "contractor -> postgres (db denies)"}
      - {group: contractor, to: "{{ lab_dns_server }}", port: 53, proto: udp, comment: "contractor -> lab DNS"}
      - {group: contractor, to: "{{ lab_dns_server }}", port: 53, proto: tcp, comment: "contractor -> lab DNS (tcp)"}

  pre_tasks:
    - name: Require the public endpoint remote workers dial
      ansible.builtin.assert:
        that: lab_vpn_endpoint | length > 0
        fail_msg: "Set LAB_VPN_ENDPOINT to the lab's public IP or DDNS name."
        quiet: true

  roles:
    - role: kyl191.openvpn
      # --- Transport ------------------------------------------------
      openvpn_port: 1194
      openvpn_proto: udp
      openvpn_dualstack: false
      openvpn_server_network: 10.9.0.0
      openvpn_server_netmask: 255.255.255.0
      openvpn_server_ipv6_network: ""    # IPv4-only lab
      openvpn_server_hostname: "{{ lab_vpn_endpoint }}"

      # --- Split tunnel: push only lab + AWS routes ------------------
      openvpn_redirect_gateway: ""       # do not hijack client default route
      openvpn_push:
        - "route {{ lab_onprem_network }} {{ lab_onprem_netmask }}"
        - "route {{ aws_vpc_network }} {{ aws_vpc_netmask }}"
      openvpn_set_dns: true
      openvpn_custom_dns:
        - "{{ lab_dns_server }}"

      # --- Behavior --------------------------------------------------
      openvpn_client_to_client: false
      openvpn_topology: subnet
      openvpn_client_register_dns: false # no Windows clients in the lab

      # --- Fixed client addresses (group membership) ------------------
      # ccd-exclusive refuses any certificate without an entry here, so
      # no client can fall back to an address outside its group range.
      openvpn_client_config: true
      openvpn_client_configs:
        remote-admin: ["ifconfig-push 10.9.0.17 255.255.255.0"]
        remote-developer: ["ifconfig-push 10.9.0.18 255.255.255.0"]
        remote-analyst: ["ifconfig-push 10.9.0.19 255.255.255.0"]
        remote-contractor: ["ifconfig-push 10.9.0.33 255.255.255.0"]
      openvpn_addl_server_options:
        - ccd-exclusive

      # --- Security --------------------------------------------------
      openvpn_cipher: "AES-256-GCM"
      openvpn_auth_alg: SHA256
      openvpn_use_tls_crypt: true
      openvpn_use_crl: true              # honor revocations
      openvpn_sync_certs: true           # revoke anything not listed below
      openvpn_verify_cn: false
      openvpn_duplicate_cn: false
      openvpn_client_cn_prefix: ""       # plain client names as CNs (= ccd names)

      # --- Clients: one per emulated remote-worker role --------------
      # These identities deliberately mirror the roles used later in the
      # ZTNA phases so access-test results are comparable across phases.
      openvpn_clients:
        - remote-admin
        - remote-developer
        - remote-analyst
        - remote-contractor

      # --- Fetch generated .ovpn profiles locally ---------------------
      openvpn_fetch_client_configs: true
      openvpn_fetch_client_configs_dir: "{{ lookup('env', 'HOME') }}/ovpn-client-configs"
      openvpn_fetch_client_configs_per_user_dir: true

      # --- Firewall / NAT --------------------------------------------
      # The role SNATs tunnel traffic to tpi2-4's LAN address, so on-prem
      # and AWS targets see 10.0.0.251; filtering happens before SNAT, on
      # the real tunnel addresses.
      openvpn_firewall: ufw              # Ubuntu default
      openvpn_manage_firewall_rules: true
      openvpn_manage_sysctl: true        # enable IPv4 forwarding

  post_tasks:
    # kyl191.openvpn sets ufw to incoming ALLOW and forward ACCEPT on every
    # run. These tasks run after its handlers and restore default-deny.
    - name: Perimeter ruleset | allow listed group traffic from the tunnel
      community.general.ufw:
        rule: allow
        route: true
        interface_in: tun0
        from_ip: "{{ vpn_group_ranges[item.group] }}"
        to_ip: "{{ item.to }}"
        to_port: "{{ item.port | default(omit) }}"
        proto: "{{ item.proto | default('any') }}"
        comment: "{{ item.comment }}"
      loop: "{{ perimeter_ruleset }}"
      loop_control:
        label: "{{ item.comment }}"

    - name: Perimeter ruleset | deny all other routed traffic
      community.general.ufw:
        default: deny
        direction: routed

    - name: Host firewall | allow SSH and monitoring from the lab LAN
      community.general.ufw:
        rule: allow
        from_ip: "{{ lab_onprem_cidr }}"
        comment: "lab LAN -> tpi2-4 (ssh, node_exporter)"

    - name: Host firewall | deny all other inbound (1194/udp and tun0 stay open)
      community.general.ufw:
        default: deny
        direction: incoming

    - name: Record deployed OpenVPN version (data collection)
      ansible.builtin.command: openvpn --version
      register: openvpn_version
      changed_when: false

    - name: Record the live ruleset (Phase 3 translation input)
      ansible.builtin.command: ufw status verbose
      register: ufw_status
      changed_when: false

    - name: Show version and ruleset for the work journal
      ansible.builtin.debug:
        msg: "{{ [openvpn_version.stdout_lines[0]] + ufw_status.stdout_lines }}"

- name: Connect tpi2-4 to the AWS site-to-site hub
  hosts: vpn
  become: true
  gather_facts: false

  vars:
    s2s_profile: "{{ lookup('env', 'HOME') }}/ovpn-client-configs/tpi2-4/aws-vpn-gateway.ovpn"
    s2s_unit: openvpn-client@aws-s2s
    aws_app_url: http://10.100.10.10:8080/

  handlers:
    - name: Restart site-to-site tunnel
      ansible.builtin.systemd_service:
        name: "{{ s2s_unit }}"
        state: restarted

  tasks:
    - name: Install the site-to-site profile fetched from the hub
      ansible.builtin.copy:
        src: "{{ s2s_profile }}"
        dest: /etc/openvpn/client/aws-s2s.conf
        owner: root
        group: root
        mode: "0600"
      notify: Restart site-to-site tunnel

    - name: Enable and start the site-to-site tunnel
      ansible.builtin.systemd_service:
        name: "{{ s2s_unit }}"
        enabled: true
        state: started

    - name: Apply a changed profile now
      ansible.builtin.meta: flush_handlers

    - name: Wait for the AWS VPC route through the tunnel
      ansible.builtin.command: ip -4 route show 10.100.0.0/16
      register: s2s_route
      until: "'s2s0' in s2s_route.stdout"
      retries: 12
      delay: 5
      changed_when: false

    - name: Verify aws-app answers through the tunnel
      ansible.builtin.uri:
        url: "{{ aws_app_url }}"
      register: aws_app
      until: aws_app.status == 200
      retries: 6
      delay: 5
