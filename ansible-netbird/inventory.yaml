# NetBird, Phase 2: management server, dashboard and IdP proxy on the AWS
# edge host; routing peers on tpi2-4 and the edge host. Edge host address
# from the environment so no public IP is committed:
#   export LAB_EDGE_IP=$(terraform -chdir=../terraform-aws output -raw edge_host_public_ip)
---
all:
  children:
    edge_host:
      hosts:
        nb-edge:
          ansible_host: "{{ lookup('env', 'LAB_EDGE_IP') }}"
    # tpi2-4: lab end of the site-to-site tunnel (IdP relay path)
    lab_gateway:
      hosts:
        tpi2-4:
          ansible_host: 10.0.0.251
    # NetBird routing peers (site.yaml): tpi2-4 for the lab network, the
    # edge host for the AWS network
    netbird_routing_peers:
      hosts:
        tpi2-4:
        nb-edge:
  vars:
    ansible_user: ubuntu
    ansible_python_interpreter: /usr/bin/python3
