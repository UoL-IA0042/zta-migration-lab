# NetBird self-hosted configuration.
# NetBird's supported self-hosted path is their configure.sh template
# processor; this component wraps it rather than reimplementing the
# compose stack, so upstream template changes are absorbed automatically.
---
netbird_version: "latest"         # pin to a release tag at deploy time; journal it
netbird_install_dir: /opt/netbird
netbird_repo: "https://github.com/netbirdio/netbird.git"

netbird_domain: 10.0.0.72         # lab: bare IP, no TLS in front

# Keycloak OIDC (see docs.netbird.io/selfhosted/identity-providers/keycloak).
# The keycloak realm needs the netbird client (already in ansible-keycloak)
# plus, per NetBird docs, a service client for user-management API access.
keycloak_issuer: "http://10.0.0.72:8080/realms/lab"
netbird_client_id: "netbird"
netbird_client_secret: "CHANGE-ME-USE-VAULT"

# setup.env values consumed by configure.sh
netbird_setup_env:
  NETBIRD_DOMAIN: "{{ netbird_domain }}"
  NETBIRD_AUTH_OIDC_CONFIGURATION_ENDPOINT: "{{ keycloak_issuer }}/.well-known/openid-configuration"
  NETBIRD_AUTH_CLIENT_ID: "{{ netbird_client_id }}"
  NETBIRD_AUTH_CLIENT_SECRET: "{{ netbird_client_secret }}"
  NETBIRD_AUTH_AUDIENCE: "{{ netbird_client_id }}"
  NETBIRD_MGMT_IDP: "keycloak"
  NETBIRD_IDP_MGMT_CLIENT_ID: "{{ netbird_client_id }}"
  NETBIRD_IDP_MGMT_CLIENT_SECRET: "{{ netbird_client_secret }}"
  NETBIRD_IDP_MGMT_EXTRA_ADMIN_ENDPOINT: "http://10.0.0.72:8080/admin/realms/lab"
  NETBIRD_DISABLE_LETSENCRYPT: "true"
