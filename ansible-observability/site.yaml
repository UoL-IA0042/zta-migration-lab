# Observability: node_exporter and Alloy everywhere, Prometheus/Grafana/Loki on tpi2-1.
# Deploy BEFORE Phase 1 so baseline measurements are captured.
---
- name: Install node_exporter on all nodes
  hosts: exporters
  become: true
  tasks:
    - name: Install prometheus-node-exporter
      ansible.builtin.apt:
        name: prometheus-node-exporter
        state: present
        update_cache: true

    - name: Enable and start node_exporter
      ansible.builtin.systemd:
        name: prometheus-node-exporter
        enabled: true
        state: started

- name: Deploy observability stack on tpi2-1
  hosts: observability
  become: true
  tasks:
    - name: Install Docker Engine and compose plugin
      ansible.builtin.apt:
        name: [docker.io, docker-compose-v2]
        state: present
        update_cache: true

    - name: Enable and start Docker
      ansible.builtin.systemd:
        name: docker
        enabled: true
        state: started

    - name: Create install directory
      ansible.builtin.file:
        path: "{{ obs_install_dir }}"
        state: directory
        mode: "0750"

    # Bind-mount sources must exist with the container's UID before
    # compose starts; otherwise Docker creates them root-owned and the
    # non-root containers cannot write to them.
    - name: Create data directories owned by each container's user
      ansible.builtin.file:
        path: "{{ obs_install_dir }}/{{ item.dir }}"
        state: directory
        owner: "{{ item.uid }}"
        group: "{{ item.gid }}"
        mode: "0750"
      loop:
        - {dir: prom-data, uid: 65534, gid: 65534}     # prom/prometheus runs as nobody
        - {dir: loki-data, uid: 10001, gid: 10001}     # grafana/loki runs as loki
        - {dir: grafana-data, uid: 472, gid: 0}        # grafana/grafana runs as grafana
      loop_control:
        label: "{{ item.dir }}"

    - name: Template Prometheus config
      ansible.builtin.template:
        src: templates/prometheus.yaml.j2
        dest: "{{ obs_install_dir }}/prometheus.yaml"
        mode: "0644"
      register: prom_cfg

    - name: Provision Grafana datasources (Prometheus + Loki)
      ansible.builtin.copy:
        dest: "{{ obs_install_dir }}/grafana-datasources.yaml"
        mode: "0644"
        content: |
          apiVersion: 1
          datasources:
            - name: Prometheus
              type: prometheus
              url: http://prometheus:9090
              isDefault: true
            - name: Loki
              type: loki
              url: http://loki:3100

    - name: Template compose file
      ansible.builtin.template:
        src: templates/docker-compose.yaml.j2
        dest: "{{ obs_install_dir }}/docker-compose.yaml"
        mode: "0640"

    - name: Start stack
      ansible.builtin.command:
        cmd: docker compose up -d
        chdir: "{{ obs_install_dir }}"
      register: up
      changed_when: "'Started' in up.stderr or 'Created' in up.stderr"

    - name: Reload Prometheus on config change
      ansible.builtin.command:
        cmd: docker compose kill -s SIGHUP prometheus
        chdir: "{{ obs_install_dir }}"
      when: prom_cfg.changed

    - name: Wait for Prometheus readiness
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}:9090/-/ready"
        status_code: 200
      retries: 12
      delay: 5
      register: prom_ready
      until: prom_ready.status == 200

    - name: Wait for Loki readiness
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}:3100/ready"
        status_code: 200
      retries: 24
      delay: 5
      register: loki_ready
      until: loki_ready.status == 200

- name: Deploy Alloy log agent on all nodes
  hosts: log_agents
  become: true
  tasks:
    - name: Create apt keyring directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Install Grafana apt signing key
      ansible.builtin.get_url:
        url: https://apt.grafana.com/gpg-full.key
        dest: /etc/apt/keyrings/grafana.asc
        mode: "0644"

    - name: Add Grafana apt repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/grafana.asc] https://apt.grafana.com stable main"
        filename: grafana
        state: present

    - name: Install Alloy
      ansible.builtin.apt:
        name: "alloy={{ alloy_version }}"
        state: present
        update_cache: true

    # Created ahead of Docker so Alloy already holds the group when a later
    # component installs docker.io (its postinst reuses an existing group).
    - name: Pre-create docker group
      ansible.builtin.group:
        name: docker
        system: true
        state: present
      when: alloy_collect_docker

    - name: Grant Alloy read access to the journal (and Docker)
      ansible.builtin.user:
        name: alloy
        groups: "{{ ['adm', 'systemd-journal'] + (['docker'] if alloy_collect_docker else []) }}"
        append: true
      notify: Restart alloy

    - name: Template Alloy config
      ansible.builtin.template:
        src: templates/config.alloy.j2
        dest: /etc/alloy/config.alloy
        mode: "0644"
        validate: /usr/bin/alloy fmt %s
      notify: Reload alloy

    - name: Enable and start Alloy
      ansible.builtin.systemd:
        name: alloy
        enabled: true
        state: started

  handlers:
    - name: Reload alloy
      ansible.builtin.systemd:
        name: alloy
        state: reloaded

    - name: Restart alloy
      ansible.builtin.systemd:
        name: alloy
        state: restarted

- name: Verify every node is shipping logs to Loki
  hosts: observability
  gather_facts: false
  tasks:
    - name: Wait until Loki has received logs from every node
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}:3100/loki/api/v1/label/host/values"
        return_content: true
      register: loki_hosts
      retries: 12
      delay: 10
      until: (loki_hosts.json.data | default([])) is superset(groups['log_agents'])
