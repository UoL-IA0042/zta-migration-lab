# Observability: node_exporter everywhere, Prometheus/Grafana/Loki on tpi2-1.
# Deploy BEFORE Phase 1 so baseline measurements are captured.
---
- name: Install node_exporter on all nodes
  hosts: exporters
  become: true
  tasks:
    - name: Install prometheus-node-exporter
      ansible.builtin.apt:
        name: prometheus-node-exporter
        state: present
        update_cache: true

    - name: Enable and start node_exporter
      ansible.builtin.systemd:
        name: prometheus-node-exporter
        enabled: true
        state: started

- name: Deploy observability stack on tpi2-1
  hosts: observability
  become: true
  tasks:
    - name: Install Docker Engine and compose plugin
      ansible.builtin.apt:
        name: [docker.io, docker-compose-v2]
        state: present
        update_cache: true

    - name: Enable and start Docker
      ansible.builtin.systemd:
        name: docker
        enabled: true
        state: started

    - name: Create install directory
      ansible.builtin.file:
        path: "{{ obs_install_dir }}"
        state: directory
        mode: "0750"

    - name: Template Prometheus config
      ansible.builtin.template:
        src: templates/prometheus.yaml.j2
        dest: "{{ obs_install_dir }}/prometheus.yaml"
        mode: "0644"
      register: prom_cfg

    - name: Provision Grafana datasources (Prometheus + Loki)
      ansible.builtin.copy:
        dest: "{{ obs_install_dir }}/grafana-datasources.yaml"
        mode: "0644"
        content: |
          apiVersion: 1
          datasources:
            - name: Prometheus
              type: prometheus
              url: http://prometheus:9090
              isDefault: true
            - name: Loki
              type: loki
              url: http://loki:3100

    - name: Template compose file
      ansible.builtin.template:
        src: templates/docker-compose.yaml.j2
        dest: "{{ obs_install_dir }}/docker-compose.yaml"
        mode: "0640"

    - name: Start stack
      ansible.builtin.command:
        cmd: docker compose up -d
        chdir: "{{ obs_install_dir }}"
      register: up
      changed_when: "'Started' in up.stderr or 'Created' in up.stderr"

    - name: Reload Prometheus on config change
      ansible.builtin.command:
        cmd: docker compose kill -s SIGHUP prometheus
        chdir: "{{ obs_install_dir }}"
      when: prom_cfg.changed

    - name: Wait for Prometheus readiness
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}:9090/-/ready"
        status_code: 200
      retries: 12
      delay: 5
      register: prom_ready
      until: prom_ready.status == 200
