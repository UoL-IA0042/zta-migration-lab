# Observability configuration. Image tags use major-version pins; record
# the exact resolved digests in the journal at deployment time.
---
obs_install_dir: /opt/observability

prometheus_image: "prom/prometheus:v3.5.0"
grafana_image: "grafana/grafana:12.1.0"
loki_image: "grafana/loki:3.5.0"

prometheus_retention: 90d            # cover the full experimental period
prometheus_scrape_interval: 15s

grafana_admin_user: admin
grafana_admin_password: "{{ vault_grafana_admin_password }}"

# Scrape targets (node_exporter listens on :9100)
node_exporter_targets:
  - 10.0.0.71
  - 10.0.0.72
  - 10.0.0.73
  - 10.0.0.251

# Log shipping: Grafana Alloy on every node pushes to Loki on tpi2-1.
# VERIFY at deploy time: confirm the current 1.x release in the Grafana
# apt repository and record the resolved package version in the journal.
alloy_version: "1.20.*"
loki_push_url: "http://10.0.0.71:3100/loki/api/v1/push"
alloy_collect_docker: true           # container logs; needs docker group (root-equivalent)
