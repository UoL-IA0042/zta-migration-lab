# Observability stack on tpi2-1; node_exporter and Alloy on every node.
---
all:
  children:
    observability:
      hosts:
        tpi2-1:
          ansible_host: 10.0.0.71
    exporters:
      hosts:
        tpi2-1: {ansible_host: 10.0.0.71}
        tpi2-2: {ansible_host: 10.0.0.72}
        tpi2-3: {ansible_host: 10.0.0.73}
        tpi2-4: {ansible_host: 10.0.0.74}
    log_agents:
      hosts:
        tpi2-1: {ansible_host: 10.0.0.71}
        tpi2-2: {ansible_host: 10.0.0.72}
        tpi2-3: {ansible_host: 10.0.0.73}
        tpi2-4: {ansible_host: 10.0.0.74}
  vars:
    ansible_user: ubuntu
    ansible_python_interpreter: /usr/bin/python3
