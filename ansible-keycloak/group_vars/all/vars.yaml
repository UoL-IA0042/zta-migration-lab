# Keycloak deployment configuration.
# ALL secrets below are placeholders: encrypt real values with ansible-vault
# before first run. Nothing secret belongs in the realm template itself.
---
# --- Versions (verified current 2026-08) ------------------------------
keycloak_version: "26.7.3"
postgres_version: "16"

# --- Service ----------------------------------------------------------
keycloak_host: 10.0.0.72        # tpi2-2
keycloak_port: 8443
keycloak_http_port: 8080           # plain HTTP on the lab network
keycloak_install_dir: /opt/keycloak

# --- Public issuer (Phase 2+) ------------------------------------------
# With LAB_EDGE_IP set (terraform output edge_host_public_ip), Keycloak is
# published through the AWS edge host's reverse proxy and that https URL
# becomes the issuer for every client (ZTNA control planes, tunnelers).
# Unset: phase-0 behaviour, issuer http://<keycloak_host>:<keycloak_http_port>.
# From the environment so no public address is committed.
lab_edge_ip: "{{ lookup('env', 'LAB_EDGE_IP') }}"
keycloak_public_url: "{{ ('https://idp.' ~ (lab_edge_ip | replace('.', '-')) ~ '.sslip.io') if lab_edge_ip else '' }}"
keycloak_base_url: "{{ keycloak_public_url or ('http://' ~ keycloak_host ~ ':' ~ keycloak_http_port | string) }}"

# Bootstrap admin (rotate after first login)
keycloak_admin_user: admin
keycloak_admin_password: "{{ vault_keycloak_admin_password }}"

# Backing database
keycloak_db_name: keycloak
keycloak_db_user: keycloak
keycloak_db_password: "{{ vault_keycloak_db_password }}"

# --- Realm-as-code ----------------------------------------------------
realm_name: lab

# The four experimental roles; must match the VPN client identities and
# the test-matrix roles exactly, so results are comparable across phases.
lab_roles:
  - name: remote-admin
    description: Full administrative access to lab resources
  - name: remote-developer
    description: Developer access to applications and databases
  - name: remote-analyst
    description: Read-only analytical access
  - name: remote-contractor
    description: Minimal contractor access

# One test user per role (username == role for probe simplicity).
# Passwords vaulted; exported to probing machines via environment.
lab_users:
  - username: remote-admin
    password: "{{ vault_remote_admin_password }}"
  - username: remote-developer
    password: "{{ vault_remote_developer_password }}"
  - username: remote-analyst
    password: "{{ vault_remote_analyst_password }}"
  - username: remote-contractor
    password: "{{ vault_remote_contractor_password }}"

# OIDC clients for the ZTNA control planes (Phase 2).
oidc_clients:
  # Ziti tunnelers log in with authorization code + PKCE and no secret,
  # so the client is public; tokens must carry aud=openziti for the
  # controller's ext-jwt-signer (audience mapper).
  - client_id: openziti
    secret: "{{ vault_openziti_secret }}"   # unused while public
    public: true
    pkce: true
    audience_mapper: true
    redirect_uris:
      - "http://localhost:20314/auth/callback"   # Ziti tunnelers (OpenZiti OIDC reference)
  # NetBird's embedded IdP (Dex) uses Keycloak as an upstream OIDC
  # connector: confidential client, redirect to the connector callback on
  # the edge host, realm roles also emitted as "groups" (the connector's
  # groups claim, used for NetBird's JWT group sync). The secret is shared
  # with ansible-netbird, which reads it from this vault.
  - client_id: netbird
    secret: "{{ vault_netbird_secret }}"
    groups_mapper: true
    redirect_uris: "{{ ['https://netbird.' ~ (lab_edge_ip | replace('.', '-')) ~ '.sslip.io/oauth2/callback'] if lab_edge_ip else [] }}"
