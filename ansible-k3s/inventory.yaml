# K3s cluster inventory for the Turing Pi 2 (4x RK1, Ubuntu ARM64).
# tpi2-2 = control plane (consistent with its identity/control-plane role);
# tpi2-1, tpi2-3, tpi2-4 = agents. Remove tpi2-1 from k3s_agents if you prefer
# to keep the observability node out of the cluster.
---
all:
  children:
    k3s_server:
      hosts:
        tpi2-2:
          ansible_host: 10.0.0.72
    k3s_agents:
      hosts:
        tpi2-1:
          ansible_host: 10.0.0.71
        tpi2-3:
          ansible_host: 10.0.0.73
        tpi2-4:
          ansible_host: 10.0.0.74
    k3s_cluster:
      children:
        k3s_server:
        k3s_agents:
  vars:
    ansible_user: ubuntu
    ansible_python_interpreter: /usr/bin/python3
